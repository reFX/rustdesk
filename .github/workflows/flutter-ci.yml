name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    # reFX: our work lives on refx, and we want a build out of every push.
    # res/ and .github/ are no longer ignored - the icons are compiled into the
    # Windows binary by winres, and a broken workflow edit should fail here
    # rather than the next time someone cuts a release.
    branches:
      - refx
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    # reFX: needed for the signing steps, which read the org-level Apple and
    # Azure secrets
    secrets: inherit
    with:
      # reFX: every run produces downloadable artifacts, not just the nightly
      upload-artifact: true
